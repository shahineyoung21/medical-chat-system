name: Flutter Android demo APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Test FastAPI backend
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          python -m pytest backend/tests -q

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics --no-cli-animations

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run widget tests
        run: flutter test --no-pub

      - name: Build installable debug APK
        env:
          SABAH_API_BASE_URL: ${{ vars.SABAH_API_BASE_URL }}
        run: flutter build apk --debug --no-pub --dart-define="SABAH_API_BASE_URL=$SABAH_API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sabah-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
